<ion-header class="page-header ion-no-border"><ion-toolbar><h1>Suggestions</h1></ion-toolbar></ion-header>
<ion-content class="page-content" [fullscreen]="true">
  <section class="intro"><span>GOOD COMPANY</span><h2>People to meet</h2><p>Find voices that make your community feel a little bigger.</p></section>
  @for (person of people; track person.username) {
    <article class="suggestion-row">
      <ion-avatar><ion-icon name="person-circle-outline"></ion-icon></ion-avatar>
      <div class="suggestion-copy"><strong>{{ person.name }}</strong><span>{{ person.username }}</span><p>{{ person.note }}</p></div>
      <ion-button [fill]="person.following ? 'clear' : 'outline'" size="small" (click)="toggleFollow(person)"><ion-icon slot="start" [name]="person.following ? 'person-circle-outline' : 'person-add-outline'"></ion-icon>{{ person.following ? 'Following' : 'Follow' }}</ion-button>
    </article>
  }
</ion-content>
<ion-footer class="page-footer ion-no-border"><ion-toolbar>
  <ion-button fill="clear" routerLink="/home" aria-label="Home"><ion-icon slot="icon-only" name="home-outline"></ion-icon></ion-button>
  <ion-button fill="clear" routerLink="/messages" aria-label="Messages"><ion-icon slot="icon-only" name="chatbubble-outline"></ion-icon></ion-button>
  <ion-button fill="clear" class="compose-button" routerLink="/add-post" aria-label="Create post"><ion-icon slot="icon-only" name="add-circle"></ion-icon></ion-button>
  <ion-button fill="clear" class="active-tab" routerLink="/suggestions" aria-label="Suggestions"><ion-icon slot="icon-only" name="trending-up-outline"></ion-icon></ion-button>
  <ion-button fill="clear" routerLink="/profile" aria-label="Profile"><ion-icon slot="icon-only" name="person-circle-outline"></ion-icon></ion-button>
</ion-toolbar></ion-footer>
